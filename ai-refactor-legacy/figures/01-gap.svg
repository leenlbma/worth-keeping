<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="提效的三个层次：单点、分析、端到端"><defs><marker id="am-01gapsvg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#151310"/></marker><marker id="amv-01gapsvg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#BC3A1E"/></marker><marker id="amg-01gapsvg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6357"/></marker></defs><rect width="1200" height="660" fill="#FBF8F1"/><text x="64" y="58" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#BC3A1E" font-weight="600" text-anchor="start" letter-spacing="3" opacity="1">FIGURE · 提效口径</text><text x="64" y="108" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="34" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">省一半只发生在单个任务上</text><text x="64" y="142" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="15" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">端到端工期的第一波是 15%–30%，分析环节是 50%–94%。</text><text x="64" y="248" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="16" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">单点任务速度</text><text x="64" y="270" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="11.5" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">一次 API 迁移、一个组件重写</text><rect x="330" y="232" width="640" height="18" rx="9" fill="#E9E2D5" stroke="none" stroke-width="1" opacity="1"/><rect x="330" y="232" width="620.8" height="18" rx="9" fill="#3F6152" stroke="none" stroke-width="1" opacity="1"/><text x="986" y="246"