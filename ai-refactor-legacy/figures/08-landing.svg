<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="三个独立来源的 AI 产出落地率"><defs><marker id="am-08landings" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#151310"/></marker><marker id="amv-08landings" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#BC3A1E"/></marker><marker id="amg-08landings" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6357"/></marker></defs><rect width="1200" height="560" fill="#FBF8F1"/><text x="64" y="58" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#BC3A1E" font-weight="600" text-anchor="start" letter-spacing="3" opacity="1">FIGURE · 落地率</text><text x="64" y="108" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="34" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">四分之一被丢掉</text><text x="64" y="142" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="15" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Google、Meta、Amazon 三组独立数据，落地率都在 75% 上下。</text><text x="88" y="226" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="21" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">Google</text><text x="88" y="251" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">AI 生成字符最终落地比例</text><rect x="330" y="205" width="600" height="30" rx="15" fill="#E9E2D5" stroke="none" stroke-width="1" opacity="1"/><rect x="330" y="205" width="450.0" height="30" rx="15" fill="#1B3A5C" stroke="none" stroke-width="1" opacity="1"/><text x="948" y="228" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="24" fill="#1B3A5C" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">75%</text><text x="855.0" y="225" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="11.5" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">≈25% 丢弃</text><text x="88" y="275" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="10.5" fill="#8A8073" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">39 次迁移 / 595 个变更</text><text x="88" y="326" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="21" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">Meta</text><text x="88" y="351" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">测试改进建议被开发者采纳</text><rect x="330" y="305" width="600" height="30" rx="15" fill="#E9E2D5" stroke="none" stroke-width="1" opacity="1"/><rect x="330" y="305" width="438.0" height="30" rx="15" fill="#3F6152" stroke="none" stroke-width="1" opacity="1"/><text x="948" y="328" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="24" fill="#3F6152" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">73%</text><text x="849.0" y="325" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="11.5" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">≈27% 丢弃</text><text x="88" y="375" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="10.5" fill="#8A8073" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Instagram / Facebook test-a-thon</text><text x="88" y="426" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="21" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">Amazon</text><text x="88" y="451" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Java 升级代码评审通过率</text><rect x="330" y="405" width="600" height="30" rx="15" fill="#E9E2D5" stroke="none" stroke-width="1" opacity="1"/><rect x="330" y="405" width="474.0" height="30" rx="15" fill="#9C7420" stroke="none" stroke-width="1" opacity="1"/><text x="948" y="428" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="24" fill="#9C7420" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">79%</text><text x="867.0" y="425" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="11.5" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">≈21% 丢弃</text><text x="88" y="475" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="10.5" fill="#8A8073" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">30,000 个生产应用</text><line x1="64" y1="508" x2="1136" y2="508" stroke="#D9D0C1" stroke-width="1" opacity="1"/><text x="64" y="532" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="11.5" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0.2" opacity="1">来源：Google FSE'25 · Meta FSE'24 · Amazon Q Developer（厂商自报，口径不同，仅看量级）</text></svg>