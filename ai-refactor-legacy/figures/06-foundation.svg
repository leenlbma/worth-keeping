<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="认知底座的三层结构"><defs><marker id="am-06foundati" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#151310"/></marker><marker id="amv-06foundati" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#BC3A1E"/></marker><marker id="amg-06foundati" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6357"/></marker></defs><rect width="1200" height="660" fill="#FBF8F1"/><text x="64" y="58" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#BC3A1E" font-weight="600" text-anchor="start" letter-spacing="3" opacity="1">FIGURE · 认知底座</text><text x="64" y="108" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="34" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">改造前的两天准备</text><text x="64" y="142" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="15" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Qoder 并入 50 万行 agent 代码前，先整理索引、文档与历史决策。</text><rect x="96" y="226" width="809.2" height="92" rx="10" fill="#1B3A5C" stroke="none" stroke-width="1" opacity="0.12"/><rect x="96" y="226" width="4" height="92" rx="2" fill="#1B3A5C" stroke="none" stroke-width="1" opacity="1"/><text x="124" y="260" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#1B3A5C" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">L1</text><text x="166" y="260" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="17" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">代码索引与知识图谱</text><text x="166" y="288" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">模块依赖、接口契约、数据流，让 agent 知道谁调用谁</text><rect x="96" y="342" width="657.1999999999999" height="92" rx="10" fill="#3F6152" stroke="none" stroke-width="1" opacity="0.12"/><rect x="96" y="342" width="4" height="92" rx="2" fill="#3F6152" stroke="none" stroke-width="1" opacity="1"/><text x="124" y="376" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#3F6152" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">L2</text><text x="166" y="376" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="17" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">仓库级文档 Repo Wiki</text><text x="166" y="404" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">从代码、注释、提交历史生成的说明书，让它知道这是什么</text><rect x="96" y="458" width="505.2" height="92" rx="10" fill="#BC3A1E" stroke="none" stroke-width="1" opacity="0.12"/><rect x="96" y="458" width="4" height="92" rx="2" fill="#BC3A1E" stroke="none" stroke-width="1" opacity="1"/><text x="124" y="492" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#BC3A1E" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">L3</text><text x="166" y="492" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="17" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">规范与历史决策</text><text x="166" y="520" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">agents.md、ADR、为什么这层兼容逻辑存在，让它知道为什么</text><path d="M962,232 L962,556" fill="none" stroke="#D9D0C1" stroke-width="1" stroke-dasharray="3 5" opacity="1"/><text x="986" y="300" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">如果没有这一层</text><text x="986" y="324" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每个知识缺口</text><text x="986" y="346" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">都会被并行 agent</text><text x="986" y="368" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按倍数放大</text><line x1="64" y1="608" x2="1136" y2="608" stroke="#D9D0C1" stroke-width="1" opacity="1"/><text x="64" y="632" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="11.5" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0.2" opacity="1">来源：Qoder, 500,000 Lines of Agent-Written Code Entered Production（2026）· docs.qoder.com</text></svg>