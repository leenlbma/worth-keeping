<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="三种范式的适用象限"><defs><marker id="am-04matrixsv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#151310"/></marker><marker id="amv-04matrixsv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#BC3A1E"/></marker><marker id="amg-04matrixsv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6357"/></marker></defs><rect width="1200" height="700" fill="#FBF8F1"/><text x="64" y="58" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#BC3A1E" font-weight="600" text-anchor="start" letter-spacing="3" opacity="1">FIGURE · 范式选型</text><text x="64" y="108" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="34" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">三种打法的分工</text><text x="64" y="142" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="15" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">横轴是同构程度，纵轴是可判定性。</text><rect x="150" y="208" width="850" height="384" rx="10" fill="#F6F1E7" stroke="#D9D0C1" stroke-width="1" opacity="1"/><line x1="575.0" y1="208" x2="575.0" y2="592" stroke="#D9D0C1" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><line x1="150" y1="400.0" x2="1000" y2="400.0" stroke="#D9D0C1" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><text x="150" y="190" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fill="#6B6357" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">可判定：有 I/O 基线、测试或 golden master</text><text x="1000" y="190" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12" fil