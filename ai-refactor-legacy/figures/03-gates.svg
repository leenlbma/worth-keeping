<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Google 的六道验证闸门"><defs><marker id="am-03gatessvg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#151310"/></marker><marker id="amv-03gatessvg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#BC3A1E"/></marker><marker id="amg-03gatessvg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6357"/></marker></defs><rect width="1200" height="580" fill="#FBF8F1"/><text x="64" y="58" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="12" fill="#BC3A1E" font-weight="600" text-anchor="start" letter-spacing="3" opacity="1">FIGURE · 验证顺序</text><text x="64" y="108" font-family="Songti SC,Noto Serif SC,Source Han Serif SC,Georgia,serif" font-size="34" fill="#151310" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">六层验证的淘汰规则</text><text x="64" y="142" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="15" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Google 的六道检查；任一失败即丢弃，部分可回喂模型重试。</text><rect x="58" y="244.0" width="118" height="104" rx="8" fill="#EDE6D9" stroke="none" stroke-width="1" opacity="1"/><text x="117.0" y="278" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="13" fill="#151310" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">候选</text><text x="117.0" y="299" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="11" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">LLM diff</text><text x="117.0" y="318" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="11" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">×3 轮</text><polygon points="234,262 268,296 234,330 200,296" fill="#FBF8F1" stroke="#1B3A5C" stroke-width="1.6"/><text x="234" y="301" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="13" fill="#1B3A5C" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">01</text><text x="234" y="244" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="14" fill="#151310" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">成功返回</text><text x="234" y="354" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="10.5" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">模型未超时/超长</text><line x1="180" y1="296" x2="198" y2="296" stroke="#151310" stroke-width="1.3" marker-end="url(#am-03gatessvg)" opacity="1"/><polygon points="386,262 420,296 386,330 352,296" fill="#FBF8F1" stroke="#1B3A5C" stroke-width="1.6"/><text x="386" y="301" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="13" fill="#1B3A5C" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">02</text><text x="386" y="244" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="14" fill="#151310" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">非空白变更</text><text x="386" y="354" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="10.5" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">只改了格式，无效</text><line x1="270" y1="296" x2="350" y2="296" stroke="#151310" stroke-width="1.3" marker-end="url(#am-03gatessvg)" opacity="1"/><polygon points="538,262 572,296 538,330 504,296" fill="#FBF8F1" stroke="#1B3A5C" stroke-width="1.6"/><text x="538" y="301" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="13" fill="#1B3A5C" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">03</text><text x="538" y="244" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="14" fill="#151310" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">AST 可解析</text><text x="538" y="354" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="10.5" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">且语法树确有变化</text><line x1="422" y1="296" x2="502" y2="296" stroke="#151310" stroke-width="1.3" marker-end="url(#am-03gatessvg)" opacity="1"/><polygon points="690,262 724,296 690,330 656,296" fill="#FBF8F1" stroke="#1B3A5C" stroke-width="1.6"/><text x="690" y="301" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="13" fill="#1B3A5C" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">04</text><text x="690" y="244" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="14" fill="#151310" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">自评必要性</text><text x="690" y="354" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="10.5" fill="#6B6357" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">模型判定不需改，弃</text><line x1="574" y1="296" x2="654" y2="296" stroke="#151310" stroke-width="1.3" marker-end="url(#am-03gatessvg)" opacity="1"/><polygon points="842,262 876,296 842,330 808,296" fill="#FBF8F1" stroke="#1B3A5C" stroke-width="1.6"/><text x="842" y="301" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="13" fill="#1B3A5C" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">05</text><text x="842" y="244" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="14" fill="#151310" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">编译通过</text><text x="842" y="354" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-