ke="#BC3A1E" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="690" y1="336" x2="690" y2="468" stroke="#BC3A1E" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="842" y1="336" x2="842" y2="468" stroke="#BC3A1E" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="994" y1="336" x2="994" y2="468" stroke="#BC3A1E" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><text x="244" y="494" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="12.5" fill="#BC3A1E" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">失败即丢弃并标记需人工；其中一部分可回喂模型做有限次修复</text><path d="M234,468 H117.0 V352.0" fill="none" stroke="#BC3A1E" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#amv-03gatessvg)" opacity="0.85"/><text x="109.0" y="456" font-family="PingFang SC,Hiragino Sans GB,Heiti SC,Noto Sans SC,sans-serif" font-size="11.5" fill="#BC3A1E" font-weight="600" text-anchor="end" letter-spacing="0" opacity="1">回喂重试</text><line x1="64" y1="528" x2="1136" y2="528" stroke="#D9D0C1" stroke-width="1" opacity="1"/><text x="64" y="552" font-family="SF Mono,Menlo,ui-monospace,monospace" font-size="11.5" fill="#6B6357" font-weight="400" text-anchor="start" letter-spacing="0.2" opacity="1">来源：Google, Migrating Code At Scale With LLMs At Google（FSE 2025）· arXiv:2504.09691</text></svg>